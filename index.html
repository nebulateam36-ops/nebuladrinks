<title>NEBULA — Рецептуры и расчёт</title>
<style>

    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f13;
    color: #e8e8ec;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom, 20px);
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(180deg, #1a1a24 0%, #0f0f13 100%);
    padding: 18px 16px 14px;
    text-align: center;
    border-bottom: 1px solid #2a2a38;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    font-size: 10px;
    color: #6b6b7b;
    margin-top: 3px;
    letter-spacing: 1.5px;
  }

  /* ===== ГЛАВНЫЙ ЭКРАН ===== */
  .container {
    padding: 16px 14px 40px;
    max-width: 640px;
    margin: 0 auto;
  }

  .category-title {
    font-size: 11px;
    font-weight: 700;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 22px 0 10px 4px;
  }

  .category-title:first-child { margin-top: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .card {
    background: #1a1a24;
    border: 1px solid #2a2a38;
    border-radius: 14px;
    padding: 16px 10px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    text-align: center;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }

  .card:active {
    transform: scale(0.96);
    background: #22222e;
  }

  .card .emoji { font-size: 28px; line-height: 1; }
  .card .name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.25;
    color: #e8e8ec;
  }
  .card .sub {
    font-size: 10px;
    color: #6b6b7b;
    letter-spacing: 0.5px;
  }

  /* ===== МОДАЛЬНОЕ ОКНО ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0f0f13;
    z-index: 100;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .modal-overlay.active { display: block; }

  .modal {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 14px 60px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 12px;
    position: sticky;
    top: 0;
    background: #0f0f13;
    padding: 8px 0 12px;
    z-index: 5;
    border-bottom: 1px solid #1a1a24;
  }

  .modal-header h2 {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    flex: 1;
    padding-right: 6px;
  }

  .close-btn {
    background: #2a2a38;
    border: none;
    color: #e8e8ec;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .close-btn:active { background: #3a3a48; }

  /* ===== ВВОД ОБЪЁМА ===== */
  .volume-box {
    background: linear-gradient(135deg, #1a1a24, #16161e);
    border: 1px solid #2a2a38;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
  }

  .volume-box > label {
    display: block;
    font-size: 11px;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .volume-controls {
    display: grid;
    grid-template-columns: 52px 1fr 52px;
    gap: 10px;
    align-items: center;
  }

  .volume-controls button {
    background: #2a2a38;
    border: none;
    color: #e8e8ec;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    -webkit-user-select: none;
    user-select: none;
  }

  .volume-controls button:active {
    background: #3a3a48;
    transform: scale(0.94);
  }

  .volume-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .volume-input-wrap input {
    width: 100%;
    background: #0f0f13;
    border: 2px solid #3a3a48;
    border-radius: 14px;
    padding: 0 46px 0 14px;
    height: 52px;
    color: #e8e8ec;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }

  .volume-input-wrap input::-webkit-outer-spin-button,
  .volume-input-wrap input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .volume-input-wrap input:focus {
    border-color: #a78bfa;
  }

  .volume-input-wrap .unit {
    position: absolute;
    right: 16px;
    font-size: 14px;
    color: #6b6b7b;
    font-weight: 600;
    pointer-events: none;
  }

  /* ===== СЕКЦИИ ===== */
  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    margin: 24px 0 12px 2px;
  }

  /* ===== ИНГРЕДИЕНТЫ ===== */
  .ingredients {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #14141c;
    border-radius: 14px;
    padding: 6px;
  }

  .ingredient {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    font-size: 14px;
    gap: 12px;
    border-radius: 10px;
  }

  .ingredient:nth-child(odd) { background: #1a1a24; }

  .ingredient .ing-name {
    color: #c0c0d0;
    flex: 1;
    line-height: 1.3;
  }

  .ingredient .ing-value {
    font-weight: 700;
    color: #a78bfa;
    white-space: nowrap;
    font-size: 14px;
  }

  /* ===== ШАГИ ===== */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .step {
    background: #14141c;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .step-num {
    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .step-text {
    font-size: 13.5px;
    line-height: 1.55;
    color: #c8c8d4;
    flex: 1;
  }

  .note {
    background: rgba(167, 139, 250, 0.08);
    border-left: 3px solid #a78bfa;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.55;
    color: #b0b0c0;
    margin-top: 14px;
  }

  /* ===== БЛОК РАСЧЁТА ===== */
  .calc-card {
    background: #14141c;
    border: 1px solid #1f1f2a;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .calc-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }

  .calc-card-title {
    font-size: 14px;
    font-weight: 700;
    color: #e8e8ec;
    line-height: 1.3;
    flex: 1;
  }

  .calc-card-usage {

    color: #6b6b7b;
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  .calc-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-group label {

    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    padding-left: 2px;
  }

  .input-group input {
    width: 100%;
    background: #0f0f13;
    border: 2px solid #2a2a38;
    border-radius: 12px;
    padding: 0 12px;
    height: 52px;
    color: #e8e8ec;
    font-size: 16px;
    font-weight: 700;
    outline: none;
    transition: border-color 0.15s;
    text-align: center;
    -moz-appearance: textfield;
  }

  }

  .input-group input:focus {
    border-color: #34d399;
  }

  .input-group input::placeholder {
    color: #3a3a48;
    font-weight: 500;
  }

  .input-group input[readonly] {
    background: #0a0a10;
    color: #6b6b7b;
    border-color: #1f1f2a;
  }

  .calc-result {
    margin-top: 12px;
    padding: 12px 14px;
    background: rgba(52, 211, 153, 0.08);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #34d399;
    text-align: center;
    letter-spacing: 0.3px;
  }

  .calc-result.empty {
    background: rgba(107, 107, 123, 0.08);
    color: #6b6b7b;
    font-weight: 500;
  }

  /* ===== ИТОГИ ===== */
  .totals {
    background: linear-gradient(160deg, #1a1a24 0%, #0f0f13 100%);
    border: 1px solid #2a2a38;
    border-radius: 16px;
    padding: 18px 16px;
    margin-top: 16px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    font-size: 14px;
    gap: 12px;
    border-bottom: 1px solid #1a1a24;
  }

  .total-row:last-of-type { border-bottom: none; }

  .total-row .label {
    color: #a0a0b0;
    flex: 1;
    line-height: 1.3;
  }

  .total-row .value {
    font-weight: 700;
    color: #e8e8ec;
    white-space: nowrap;
  }

  .total-row.big {
    padding-top: 14px;
    margin-top: 6px;
    border-top: 1px solid #2a2a38;
    border-bottom: none;
    font-size: 15px;
  }

  .total-row.big .value {
    color: #34d399;
    font-size: 18px;
  }

  .sell-block {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid #2a2a38;
  }

  .sell-block .input-group label {
    color: #a0a0b0;
    text-transform: none;
    font-size: 12px;
    letter-spacing: 0;
    font-weight: 600;
  }

  .sell-block .input-group input {
    border-color: #34d399;
  }

  .profit-box {
    margin-top: 14px;
    padding: 16px;
    background: rgba(52, 211, 153, 0.1);
    border-radius: 12px;
    text-align: center;
    line-height: 1.7;
    font-size: 14px;
    font-weight: 700;
    color: #34d399;
  }

  .profit-box .big-num {
    font-size: 20px;
    display: block;
    margin-bottom: 4px;
  }

  .profit-box .sub {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.85;
  }

  .profit-box.negative {
    background: rgba(248, 113, 113, 0.1);
    color: #f87171;
  }

  .profit-box.empty {
    background: rgba(107, 107, 123, 0.08);
    color: #6b6b7b;
    font-weight: 500;
    font-size: 13px;
  }

  .hint {
    font-size: 12px;
    color: #6b6b7b;
    line-height: 1.55;
    margin-bottom: 12px;
    padding: 0 2px;
  }
</style>
</head>

    note: 'Вкус зависит от состава концентрата — уточните у производителя, какие ягоды в основе.'
  },
  {
    id: 'mors-seaberry',
    category: 'Морсы',
    name: 'Облепиха',
    emoji: '🟠',
    baseVolume: 10,
    ingredients: [
      { name: 'Концентрат облепихи', value: 0.9, unit: 'л' },
      { name: 'Сахарный сироп', value: 0.5, unit: 'л' },
      { name: 'Лимонный сок', value: 0.08, unit: 'л' },
      { name: 'Подготовленная холодная вода', value: 'до 10', unit: 'л', isTopUp: true }
    ],
    steps: [
      'Развести {conc} концентрата облепихи в 2–3 л подготовленной воды. Перемешать.',
      'Добавить {sugar} сахарного сиропа. Перемешать.',
      'Добавить {lemon} лимонного сока. Перемешать.',
      'Довести подготовленной холодной водой до {total}. Перемешать 1–2 минуты.',
      'Оценить цвет, запах, вкус.',
      'Охладить готовую партию.',
      'Разлить по бутылкам 300 мл, закрыть, маркировать, убрать в холодильник.'
    ],
    note: 'Облепиха даёт маслянистый слой — перед розливом тщательно перемешать. Сахарного сиропа может понадобиться больше из-за кислотности.'
  }
];

// ============================================================
// ЛОГИКА
// ============================================================

const app = document.getElementById('app');
const overlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');

let currentDrink = null;
let currentVolume = 10;

// Хранилище цен ингредиентов: { drinkId: { ingName: { price, packSize } } }
let priceStorage = {};

// Хранилище упаковки и цены продажи (общее для всех)
let packStorage = {
  bottle: { price: '' },
  cap: { price: '' },
  label: { price: '' },
  sellPrice: ''
};

// ---------- Загрузка/сохранение ----------
function loadStorage() {
  try {
    const saved = localStorage.getItem('nebula_prices_v2');
    if (saved) priceStorage = JSON.parse(saved) || {};
  } catch (e) { priceStorage = {}; }

  try {
    const savedPack = localStorage.getItem('nebula_pack_v2');
    if (savedPack) {
      const parsed = JSON.parse(savedPack);
      packStorage = {
        bottle: { price: parsed.bottle?.price || '' },
        cap: { price: parsed.cap?.price || '' },
        label: { price: parsed.label?.price || '' },
        sellPrice: parsed.sellPrice || ''
      };
    }
  } catch (e) { /* оставляем по умолчанию */ }
}

function savePrices() {
  try { localStorage.setItem('nebula_prices_v2', JSON.stringify(priceStorage)); } catch (e) {}
}

function savePack() {
  try { localStorage.setItem('nebula_pack_v2', JSON.stringify(packStorage)); } catch (e) {}
}

// ---------- Работа с ценами ингредиентов ----------
function getPrice(drinkId, ingName) {
  if (!priceStorage[drinkId]) priceStorage[drinkId] = {};
  if (!priceStorage[drinkId][ingName]) {
    priceStorage[drinkId][ingName] = { price: '', packSize: '' };
  }
  return priceStorage[drinkId][ingName];
}

function setPriceField(drinkId, ingName, field, value) {
  if (!priceStorage[drinkId]) priceStorage[drinkId] = {};
  if (!priceStorage[drinkId][ingName]) {
    priceStorage[drinkId][ingName] = { price: '', packSize: '' };
  }
  priceStorage[drinkId][ingName][field] = value;
  savePrices();
}

function setPackField(field, value) {
  if (!packStorage[field]) packStorage[field] = { price: '' };
  packStorage[field].price = value;
  savePack();
}

// ---------- Вспомогательные ----------
function toNumber(v) {
  if (v === '' || v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(',', '.'));
  return isFinite(n) && n > 0 ? n : 0;
}

function formatNumber(num) {
  if (!isFinite(num) || num === 0) return '0';
  if (num >= 1000) return Math.round(num).toString();
  if (num >= 100) return num.toFixed(1).replace(/\.0$/, '');
  if (num >= 10) return num.toFixed(1).replace(/\.0$/, '');
  if (num >= 1) return num.toFixed(2).replace(/\.?0+$/, '');
  return num.toFixed(3).replace(/\.?0+$/, '');
}

function formatMoney(num) {
  if (!isFinite(num) || num <= 0) return '0 ₽';
  return num.toFixed(2).replace('.', ',') + ' ₽';
}

// ---------- Главный экран ----------
function renderHome() {
  const categories = {};
  drinks.forEach(d => {
    if (!categories[d.category]) categories[d.category] = [];
    categories[d.category].push(d);
  });

  let html = '';
  for (const cat in categories) {
    html += `<div class="category-title">${cat}</div>`;
    html += '<div class="grid">';
    categories[cat].forEach(d => {
      html += `
        <div class="card" onclick="openDrink('${d.id}')">
          <div class="emoji">${d.emoji}</div>
          <div class="name">${d.name}</div>
          <div class="sub">${d.baseVolume} л база</div>
        </div>
      `;
    });
    html += '</div>';
  }
  app.innerHTML = html;
}

// ---------- Открытие/закрытие ----------
function openDrink(id) {
  currentDrink = drinks.find(d => d.id === id);
  currentVolume = currentDrink.baseVolume;
  renderModal();
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  overlay.scrollTop = 0;
}

function closeModal() {
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});

// ---------- Расчёт себестоимости партии ----------
function calcIngredientCost(drinkId, ing, ratio) {
  if (ing.isTopUp || ing.isCustom) return 0;
  const saved = getPrice(drinkId, ing.name);
  const price = toNumber(saved.price);
  const packSize = toNumber(saved.packSize);
  if (price <= 0 || packSize <= 0) return 0;
  const usage = ing.value * ratio;
  return (price / packSize) * usage;
}

function calcPackCost(bottles) {
  const bottle = toNumber(packStorage.bottle.price) * bottles;
  const cap = toNumber(packStorage.cap.price) * bottles;
  const label = toNumber(packStorage.label.price) * bottles;
  return { bottle, cap, label, total: bottle + cap + label };
}

// ---------- Рендер модального окна ----------
function renderModal() {
  const d = currentDrink;
  const v = currentVolume;
  const ratio = v / d.baseVolume;

  // Ингредиенты
  let ingHtml = '';
  d.ingredients.forEach(ing => {
    let displayValue;
    if (ing.isTopUp) displayValue = `до ${formatNumber(v)} ${ing.unit}`;
    else if (ing.isCustom) displayValue = ing.value;
    else displayValue = `${formatNumber(ing.value * ratio)} ${ing.unit}`;
    ingHtml += `
      <div class="ingredient">
        <span class="ing-name">${ing.name}</span>
        <span class="ing-value">${displayValue}</span>
      </div>
    `;
  });

  // Шаги
  let stepsHtml = '';
  d.steps.forEach((step, i) => {
    let text = step;
    d.ingredients.forEach(ing => {
      const key = getKeyForIngredient(ing.name);
      if (key && text.includes(`{${key}}`)) {
        let val;
        if (ing.isTopUp) val = `до ${formatNumber(v)} ${ing.unit}`;
        else if (ing.isCustom) val = ing.value;
        else val = `${formatNumber(ing.value * ratio)} ${ing.unit}`;
        text = text.replace(new RegExp(`\\{${key}\\}`, 'g'), val);
      }
    });
    text = text.replace(/\{total\}/g, `${formatNumber(v)} л`);
    stepsHtml += `
      <div class="step">
        <div class="step-num">${i + 1}</div>
        <div class="step-text">${text}</div>
      </div>
    `;
  });

  // Блок себестоимости ингредиентов
  let costHtml = '';
  d.ingredients.forEach(ing => {
    if (ing.isTopUp || ing.isCustom) return;
    const usage = ing.value * ratio;
    const saved = getPrice(d.id, ing.name);
    const price = toNumber(saved.price);
    const packSize = toNumber(saved.packSize);
    const costForUsage = (price > 0 && packSize > 0) ? (price / packSize) * usage : 0;
    const isEmpty = costForUsage <= 0;

    costHtml += `
      <div class="calc-card">
        <div class="calc-card-head">
          <div>
            <div class="calc-card-title">${ing.name}</div>
            <div class="calc-card-usage">Расход на партию: ${formatNumber(usage)} ${ing.unit}</div>
          </div>
        </div>
        <div class="calc-inputs">
          <div class="input-group">
            <label>Цена упак., ₽</label>
            <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
              value="${saved.price}"
              oninput="onPriceInput('${d.id}', '${ing.name.replace(/'/g, "\\'")}', 'price', this.value)">
          </div>
          <div class="input-group">
            <label>Объём упак., ${ing.unit}</label>
            <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
              value="${saved.packSize}"
              oninput="onPriceInput('${d.id}', '${ing.name.replace(/'/g, "\\'")}', 'packSize', this.value)">
          </div>
        </div>
        <div class="calc-result ${isEmpty ? 'empty' : ''}">
          ${isEmpty ? 'Введите цену и объём упаковки' : 'Стоимость: ' + formatMoney(costForUsage)}
        </div>
      </div>
    `;
  });

  // Блок упаковки
  const bottles = Math.floor(v / 0.3);
  const packCost = calcPackCost(bottles);

  const packHtml = `
    <div class="calc-card">
      <div class="calc-card-head">
        <div>
          <div class="calc-card-title">Бутылка 300 мл</div>
          <div class="calc-card-usage">Количество: ${bottles} шт</div>
        </div>
      </div>
      <div class="calc-inputs">
        <div class="input-group">
          <label>Цена за шт, ₽</label>
          <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
            value="${packStorage.bottle.price}"
            oninput="onPackInput('bottle', this.value)">
        </div>
        <div class="input-group">
          <label>Кол-во, шт</label>
          <input type="number" value="${bottles}" readonly>
        </div>
      </div>
      <div class="calc-result ${packCost.bottle <= 0 ? 'empty' : ''}">
        ${packCost.bottle <= 0 ? 'Введите цену за штуку' : 'Стоимость: ' + formatMoney(packCost.bottle)}
      </div>
    </div>

    <div class="calc-card">
      <div class="calc-card-head">
        <div>
          <div class="calc-card-title">Крышка</div>
          <div class="calc-card-usage">Количество: ${bottles} шт</div>
        </div>
      </div>
      <div class="calc-inputs">
        <div class="input-group">
          <label>Цена за шт, ₽</label>
          <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
            value="${packStorage.cap.price}"
            oninput="onPackInput('cap', this.value)">
        </div>
        <div class="input-group">
          <label>Кол-во, шт</label>
          <input type="number" value="${bottles}" readonly>
        </div>
      </div>
      <div class="calc-result ${packCost.cap <= 0 ? 'empty' : ''}">
        ${packCost.cap <= 0 ? 'Введите цену за штуку' : 'Стоимость: ' + formatMoney(packCost.cap)}
      </div>
    </div>

    <div class="calc-card">
      <div class="calc-card-head">
        <div>
          <div class="calc-card-title">Этикетка</div>
          <div class="calc-card-usage">Количество: ${bottles} шт</div>
        </div>
      </div>
      <div class="calc-inputs">
        <div class="input-group">
          <label>Цена за шт, ₽</label>
          <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
            value="${packStorage.label.price}"
            oninput="onPackInput('label', this.value)">
        </div>
        <div class="input-group">
          <label>Кол-во, шт</label>
          <input type="number" value="${bottles}" readonly>
        </div>
      </div>
      <div class="calc-result ${packCost.label <= 0 ? 'empty' : ''}">
        ${packCost.label <= 0 ? 'Введите цену за штуку' : 'Стоимость: ' + formatMoney(packCost.label)}
      </div>
    </div>
  `;

  modalContent.innerHTML = `
    <div class="modal-header">
      <h2>${d.emoji} ${d.name}</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="volume-box">
      <label>Хочу получить</label>
      <div class="volume-controls">
        <button onclick="changeVolume(-1)">−</button>
        <div class="volume-input-wrap">
          <input type="number" id="volumeInput" value="${v}" min="0.5" step="0.5" inputmode="decimal">
          <span class="unit">л</span>
        </div>
        <button onclick="changeVolume(1)">+</button>
      </div>
    </div>

    <div class="section-title">Ингредиенты</div>
    <div class="ingredients">${ingHtml}</div>

    <div class="section-title">Приготовление</div>
    <div class="steps">${stepsHtml}</div>

    ${d.note ? `<div class="note">💡 ${d.note}</div>` : ''}

    <div class="section-title">Себестоимость ингредиентов</div>
    <div class="hint">Укажите цену упаковки и её объём — программа посчитает стоимость расхода на партию.</div>
    <div>${costHtml}</div>

    <div class="section-title">Упаковка</div>
    <div class="hint">Количество бутылок считается автоматически: ${formatNumber(v)} л ÷ 0,3 л = ${bottles} шт.</div>
    <div>${packHtml}</div>

    <div class="totals" id="totalsBlock"></div>
  `;

  // Обработчик ввода объёма
  const input = document.getElementById('volumeInput');
  input.addEventListener('change', (e) => {
    const val = toNumber(e.target.value);
    if (val < 0.5) {
      currentVolume = 0.5;
      renderModal();
      return;
    }
    currentVolume = val;
    renderModal();
  });

  input.addEventListener('blur', (e) => {
    const val = toNumber(e.target.value);
    if (val < 0.5) {
      currentVolume = 0.5;
      renderModal();
    }
  });

  updateTotals();
}

// ---------- Изменение объёма кнопками ----------
function changeVolume(delta) {
  let v = currentVolume + delta;
  if (v < 0.5) v = 0.5;
  if (v > 1000) v = 1000;
  currentVolume = v;
  renderModal();
}

// ---------- Обработка ввода цены ингредиента ----------
function onPriceInput(drinkId, ingName, field, value) {
  setPriceField(drinkId, ingName, field, value);
  const d = drinks.find(x => x.id === drinkId);
  const ing = d.ingredients.find(x => x.name === ingName);
  const ratio = currentVolume / d.baseVolume;
  const cost = calcIngredientCost(drinkId, ing, ratio);
  const card = document.querySelector(`[data-cost-for="${drinkId}-${ingName}"]`);
  if (card) {
    card.textContent = cost > 0 ? 'Стоимость: ' + formatMoney(cost) : 'Введите цену и объём упаковки';
    card.classList.toggle('empty', cost <= 0);
  }
  updateTotals();
}

// ---------- Обработка ввода цены упаковки ----------
function onPackInput(field, value) {
  setPackField(field, value);
  const bottles = Math.floor(currentVolume / 0.3);
  const cost = toNumber(value) * bottles;
  const el = document.querySelector(`[data-pack-result="${field}"]`);
  if (el) {
    el.textContent = cost > 0 ? 'Стоимость: ' + formatMoney(cost) : 'Введите цену за штуку';
    el.classList.toggle('empty', cost <= 0);
  }
  updateTotals();
}

// ---------- Итоги ----------
function updateTotals() {
  const d = currentDrink;
  const v = currentVolume;
  const ratio = v / d.baseVolume;
  const bottles = Math.floor(v / 0.3);

  // Себестоимость ингредиентов
  let ingCost = 0;
  d.ingredients.forEach(ing => {
    ingCost += calcIngredientCost(d.id, ing, ratio);
  });

  // Упаковка
  const packCost = calcPackCost(bottles);

  const totalCost = ingCost + packCost.total;
  const costPerBottle = bottles > 0 ? totalCost / bottles : 0;

  // Продажа
  const sellPrice = toNumber(packStorage.sellPrice);
  const revenue = sellPrice * bottles;
  const profit = revenue - totalCost;
  const profitPerBottle = bottles > 0 ? profit / bottles : 0;

  const totalsEl = document.getElementById('totalsBlock');
  if (!totalsEl) return;

  const hasCost = totalCost > 0;
  const hasSell = sellPrice > 0;

  totalsEl.innerHTML = `
    <div class="total-row">
      <span class="label">Ингредиенты</span>
      <span class="value">${formatMoney(ingCost)}</span>
    </div>
    <div class="total-row">
      <span class="label">Упаковка (${bottles} шт)</span>
      <span class="value">${formatMoney(packCost.total)}</span>
    </div>
    <div class="total-row big">
      <span class="label">Себестоимость партии</span>
      <span class="value">${formatMoney(totalCost)}</span>
    </div>
    <div class="total-row">
      <span class="label">Себестоимость 1 бутылки</span>
      <span class="value">${formatMoney(costPerBottle)}</span>
    </div>

    <div class="sell-block">
      <div class="input-group">
        <label>Цена продажи 1 бутылки, ₽</label>
        <input type="number" inputmode="decimal" min="0" step="1" placeholder="0"
          value="${packStorage.sellPrice}"
          oninput="onSellPriceInput(this.value)">
      </div>
    </div>

    ${!hasCost
      ? `<div class="profit-box empty">Введите цены ингредиентов и упаковки, чтобы увидеть прибыль</div>`
      : !hasSell
        ? `<div class="profit-box empty">Введите цену продажи, чтобы увидеть прибыль</div>`
        : profit >= 0
          ? `<div class="profit-box">
               <span class="big-num">+${formatMoney(profit)}</span>
               <span class="sub">Прибыль с партии · ${formatMoney(profitPerBottle)} с бутылки</span>
             </div>`
          : `<div class="profit-box negative">
               <span class="big-num">−${formatMoney(Math.abs(profit))}</span>
               <span class="sub">Убыток с партии · ${formatMoney(Math.abs(profitPerBottle))} с бутылки</span>
             </div>`
    }
  `;
}

function onSellPriceInput(value) {
  packStorage.sellPrice = value;
  savePack();
  updateTotals();
  const input = document.querySelector('.sell-block input');
  if (input) {
    const pos = input.value.length;
    input.focus();
    try { input.setSelectionRange(pos, pos); } catch (e) {}
  }
}

// ---------- Ключи для подстановки ----------
function getKeyForIngredient(name) {
  const map = {
    'Чёрный чай': 'tea',
    'Зелёный чай': 'tea',
    'Вода для заваривания': 'water',
    'Персиковый сироп': 'peach',
    'Клубничный сироп': 'strawberry',
    'Ягодный сироп': 'berry',
    'Пюре маракуйи': 'passion',
    'Апельсиновый сок': 'orange',
    'Манговое пюре': 'mango',
    'Лимонный сок': 'lemon',
    'Сахарный сироп': 'sugar',
    'Мятный настой/экстракт': 'mint',
    'Матча': 'matcha',
    'Вода 70–80 °C для диспергирования': 'dispWater',
    'Кофейная база': 'coffee',
    'Молоко': 'milk',
    'Ванильный сироп': 'vanilla',
    'Карамельный сироп': 'caramel',
    'Фисташковый сироп': 'pistachio',
    'Клубничное пюре/сироп': 'strawberry',
    'Кокосовый напиток': 'coconut',
    'Концентрат чёрной смородины': 'conc',
    'Концентрат маракуйи': 'conc',
    'Концентрат апельсина': 'conc',
    'Концентрат малины': 'conc',
    'Концентрат смородины': 'conc',
    'Концентрат клюквы': 'conc',
    'Концентрат лесных ягод': 'conc',
    'Концентрат облепихи': 'conc'
  };
  return map[name] || null;
}

// ============================================================
// СТАРТ
// ============================================================
loadStorage();
renderHome();
</script>
