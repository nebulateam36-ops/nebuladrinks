html{

}

body{

}

header{

  text-align:center;

  z-index:10;

}

header h1{
  font-size:20px;
  font-weight:800;
  letter-spacing:3px;
  background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

header p{
  font-size:10px;
  color:#6b6b7b;
  margin-top:3px;
  letter-spacing:1.5px;
}

.container{
  padding:16px 14px 40px;
  max-width:640px;
  margin:0 auto;
}

.category-title{
  font-size:11px;
  font-weight:700;
  color:#6b6b7b;
  text-transform:uppercase;
  letter-spacing:2px;
  margin:22px 0 10px 4px;
}

.category-title:first-child{
  margin-top:4px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  background:#1a1a24;
  border:1px solid #2a2a38;
  border-radius:14px;
  padding:16px 10px;
  cursor:pointer;
  transition:transform .15s,background .15s;
  text-align:center;
  min-height:96px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:6px;
}

.card:active{
  transform:scale(.96);
  background:#22222e;
}

.card .emoji{
  font-size:28px;
  line-height:1;
}

.card .name{
  font-size:13px;
  font-weight:600;
  line-height:1.25;
  color:#e8e8ec;
}

.card .sub{
  font-size:10px;
  color:#6b6b7b;
  letter-spacing:.5px;
}

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0f0f13;
  z-index:100;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

.modal-overlay.active{
  display:block;
}

.modal{
  max-width:640px;
  margin:0 auto;
  padding:16px 14px 60px;
  animation:fadeIn .2s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(8px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:12px;
  position:sticky;
  top:0;
  background:#0f0f13;
  padding:8px 0 12px;
  z-index:5;
  border-bottom:1px solid #1a1a24;
}

.modal-header h2{
  font-size:17px;
  font-weight:700;
  line-height:1.3;
  flex:1;
  padding-right:6px;
}

.close-btn{
  background:#2a2a38;
  border:none;
  color:#e8e8ec;
  width:44px;
  height:44px;
  border-radius:50%;
  font-size:20px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:background .15s;
}

.close-btn:active{
  background:#3a3a48;
}

.volume-box{
  background:linear-gradient(135deg,#1a1a24,#16161e);
  border:1px solid #2a2a38;
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
}

.volume-box>label{
  display:block;
  font-size:11px;
  color:#6b6b7b;
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-weight:600;
  margin-bottom:12px;
}

.volume-controls{
  display:grid;
  grid-template-columns:52px 1fr 52px;
  gap:10px;
  align-items:center;
}

.volume-controls button{
  background:#2a2a38;
  border:none;
  color:#e8e8ec;
  width:52px;
  height:52px;
  border-radius:14px;
  font-size:24px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .15s,transform .1s;
  -webkit-user-select:none;
  user-select:none;
}

.volume-controls button:active{
  background:#3a3a48;
  transform:scale(.94);
}

.volume-input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}

.volume-input-wrap input{
  width:100%;
  background:#0f0f13;
  border:2px solid #3a3a48;
  border-radius:14px;
  padding:0 46px 0 14px;
  height:52px;
  color:#e8e8ec;
  font-size:20px;
  font-weight:700;
  text-align:center;
  outline:none;
  transition:border-color .15s;
  -moz-appearance:textfield;
}

.volume-input-wrap input::-webkit-outer-spin-button,
.volume-input-wrap input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.volume-input-wrap input:focus{
  border-color:#a78bfa;
}

.volume-input-wrap .unit{
  position:absolute;
  right:16px;
  font-size:14px;
  color:#6b6b7b;
  font-weight:600;
  pointer-events:none;
}

.section-title{
  font-size:11px;
  font-weight:700;
  color:#6b6b7b;
  text-transform:uppercase;
  letter-spacing:1.8px;
  margin:24px 0 12px 2px;
}

.ingredients{
  display:flex;
  flex-direction:column;
  gap:6px;
  background:#14141c;
  border-radius:14px;
  padding:6px;
}

.ingredient{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  font-size:14px;
  gap:12px;
  border-radius:10px;
}

.ingredient:nth-child(odd){

}

.ingredient .ing-name{
  color:#c0c0d0;
  flex:1;
  line-height:1.3;
}

.ingredient .ing-value{
  font-weight:700;
  color:#a78bfa;
  white-space:nowrap;
  font-size:14px;
}

.steps{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.step{
  background:#14141c;
  border-radius:12px;
  padding:14px;
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.step-num{

  height:26px;
  border-radius:50%;

  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
  flex-shrink:0;
  margin-top:1px;
}

.step-text{

  line-height:1.55;
  color:#c8c8d4;
  flex:1;
}

.note{

  border-radius:10px;
  padding:14px;
  font-size:13px;
  line-height:1.55;
  color:#b0b0c0;
  margin-top:14px;
}

.calc-card{

  border:1px solid #1f1f2a;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
}

.calc-card-head{

  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:12px;
}

.calc-card-title{

  font-weight:700;
  color:#e8e8ec;
  line-height:1.3;
  flex:1;
}

.calc-card-usage{

  color:#6b6b7b;
  margin-top:3px;
  letter-spacing:.3px;
}

.calc-inputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.input-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.input-group label{

  color:#6b6b7b;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:600;
  padding-left:2px;
}

.input-group input{

  background:#0f0f13;
  border:2px solid #2a2a38;
  border-radius:12px;

  height:52px;
  color:#e8e8ec;
  font-size:16px;
  font-weight:700;

}

.input-group input::-webkit-outer-spin-button,
.input-group input::-webkit-inner-spin-button{

.input-group input:focus{

}

.input-group input::placeholder{

  font-weight:500;
}

.input-group input[readonly]{

  color:#6b6b7b;
  border-color:#1f1f2a;
}

.calc-result{
  margin-top:12px;
  padding:12px 14px;
  background:rgba(52,211,153,.08);
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  color:#34d399;
  text-align:center;
  letter-spacing:.3px;
}

.calc-result.empty{

  color:#6b6b7b;
  font-weight:500;
}

.totals{
  background:linear-gradient(160deg,#1a1a24 0%,#0f0f13 100%);
  border:1px solid #2a2a38;
  border-radius:16px;
  padding:18px 16px;
  margin-top:16px;

.total-row{

.total-row:last-of-type{

}

.total-row .label{

.total-row .value{

  color:#e8e8ec;

.total-row.big{

  font-size:15px;

  font-size:18px;

.sell-block{

  letter-spacing:0;

.profit-box{
  margin-top:14px;
  padding:16px;
  background:rgba(52,211,153,.1);
  border-radius:12px;
  text-align:center;
  line-height:1.7;
  font-size:14px;
  font-weight:700;

.profit-box .sub{

.profit-box.negative{

}

.profit-box.empty{
  background:rgba(107,107,123,.08);
  color:#6b6b7b;
  font-weight:500;
  font-size:13px;
}

.hint{
  font-size:12px;
  color:#6b6b7b;
  line-height:1.55;
  margin-bottom:12px;
  padding:0 2px;
}
</style>
</head>

/* ==========================================================
   ХРАНИЛИЩЕ
========================================================== */

let currentDrink=null;
let currentVolume=10;

let priceStorage={};
let packStorage={
  bottle:{price:''},
  cap:{price:''},
  label:{price:''},
  sellPrice:''
};


/* ==========================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================================================== */

function toNumber(value){
  const n=parseFloat(String(value).replace(',','.'));
  return Number.isFinite(n)?n:0;
}

function formatNumber(value){
  return Number(value).toLocaleString('ru-RU',{
    maximumFractionDigits:2
  });
}

function formatMoney(value){
  return Number(value||0).toLocaleString('ru-RU',{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })+' ₽';
}

function safeKey(value){
  return String(value)
    .replace(/[^\wа-яА-ЯёЁ0-9]+/g,'_')
    .toLowerCase();
}


/* ==========================================================
   LOCAL STORAGE
========================================================== */

function loadStorage(){

  try{
    const savedPrices=localStorage.getItem('nebula_prices');

    if(savedPrices){
      priceStorage=JSON.parse(savedPrices);
    }
  }catch(e){
    priceStorage={};
  }

  try{
    const savedPack=localStorage.getItem('nebula_pack');

    if(savedPack){
      packStorage={
        ...packStorage,
        ...JSON.parse(savedPack)
      };
    }
  }catch(e){}
}

function savePrices(){
  localStorage.setItem(
    'nebula_prices',
    JSON.stringify(priceStorage)
  );
}

function savePack(){
  localStorage.setItem(
    'nebula_pack',
    JSON.stringify(packStorage)
  );
}


/* ==========================================================
   ЦЕНЫ ИНГРЕДИЕНТОВ
========================================================== */

function getPriceData(drinkId,ingredientName){

  if(!priceStorage[drinkId]){
    priceStorage[drinkId]={};
  }

  if(!priceStorage[drinkId][ingredientName]){
    priceStorage[drinkId][ingredientName]={
      price:'',
      packSize:''
    };
  }

  return priceStorage[drinkId][ingredientName];
}

function setPriceField(
  drinkId,
  ingredientName,
  field,
  value
){

  const data=getPriceData(
    drinkId,
    ingredientName
  );

  data[field]=value;

  savePrices();
}


/* ==========================================================
   СЕБЕСТОИМОСТЬ ИНГРЕДИЕНТА
========================================================== */

function calcIngredientCost(
  drinkId,
  ingredient,
  ratio
){

  const data=getPriceData(
    drinkId,
    ingredient.name
  );

  const price=toNumber(data.price);
  const packSize=toNumber(data.packSize);

  if(price<=0 || packSize<=0){
    return 0;
  }

  const usage=ingredient.value*ratio;

  return usage/packSize*price;
}


/* ==========================================================
   УПАКОВКА
========================================================== */

function calcPackCost(bottles){

  const bottle=
    toNumber(packStorage.bottle.price)*bottles;

  const cap=
    toNumber(packStorage.cap.price)*bottles;

  const label=
    toNumber(packStorage.label.price)*bottles;

  return{
    bottle,
    cap,
    label,
    total:bottle+cap+label
  };
}


/* ==========================================================
   ГЛАВНАЯ
========================================================== */

function renderHome(){

  const app=document.getElementById('app');

  const categories=[
    ...new Set(
      drinks.map(d=>d.category)
    )
  ];

  app.innerHTML=categories.map(category=>{

    const items=drinks.filter(
      d=>d.category===category
    );

    return `
      <div class="category-title">
        ${category}
      </div>

      <div class="grid">

        ${items.map(d=>`

          <div
            class="card"
            onclick="openDrink('${d.id}')"
          >

            <div class="emoji">
              ${d.emoji}
            </div>

            <div class="name">
              ${d.name}
            </div>

            <div class="sub">
              рецепт · ${d.baseVolume} л
            </div>

          </div>

        `).join('')}

      </div>
    `;

  }).join('');
}


/* ==========================================================
   ОТКРЫТИЕ НАПИТКА
========================================================== */

function openDrink(id){

  currentDrink=drinks.find(
    d=>d.id===id
  );

  if(!currentDrink)return;

  currentVolume=currentDrink.baseVolume;

  renderModal();

  document
    .getElementById('modalOverlay')
    .classList.add('active');

  document.body.style.overflow='hidden';
}


/* ==========================================================
   ЗАКРЫТИЕ
========================================================== */

function closeModal(){

  document
    .getElementById('modalOverlay')
    .classList.remove('active');

  document.body.style.overflow='';

  currentDrink=null;
}


/* ==========================================================
   ESC
========================================================== */

document.addEventListener(
  'keydown',
  e=>{
    if(e.key==='Escape'){
      closeModal();
    }
  }
);


/* ==========================================================
   РЕНДЕР МОДАЛКИ
========================================================== */

function renderModal(){

  const v=currentVolume;

  const ratio=v/d.baseVolume;

  const modalContent=

        getPriceData(
          d.id,
          ing.name

          ing,
          ratio

                Цена упак., ₽

              <input
                type="number"
                inputmode="decimal"
                min="0"
                step="0.01"
                placeholder="0"
                value="${saved.price}"
                oninput="
                  onPriceInput(
                    '${d.id}',
                    '${escapeQuotes(ing.name)}',
                    'price',
                    this.value
                  )
                "
              >

            </div>


            <div class="input-group">

              <label>
                Объём упак., ${ing.unit}
              </label>

              <input
                type="number"
                inputmode="decimal"
                min="0"
                step="0.01"
                placeholder="0"
                value="${saved.packSize}"

                  onPriceInput(
                    '${d.id}',
                    '${escapeQuotes(ing.name)}',
                    'packSize',
                    this.value
                  )
                "
              >

            </div>

          </div>


          <div
            class="calc-result ${isEmpty?'empty':''}"
            data-cost-for="${d.id}-${key}"
          >

            ${
              isEmpty
              ?
              'Введите цену и объём упаковки'
              :
              'Стоимость: '+formatMoney(cost)
            }

          </div>

        </div>

      `;

    }
  ).join('');


  /* ---------- УПАКОВКА ---------- */

  const bottles=
    Math.floor(v/0.3);

  const packCost=
    calcPackCost(bottles);


  const packHtml=`

    <div class="calc-card">

      <div class="calc-card-head">

        <div>

          <div class="calc-card-title">
            Бутылка 300 мл
          </div>

          <div class="calc-card-usage">
            Количество: ${bottles} шт
          </div>

        </div>

      </div>


      <div class="calc-inputs">

        <div class="input-group">

          <label>
            Цена за шт, ₽
          </label>

          <input
            type="number"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="0"
            value="${packStorage.bottle.price}"
            oninput="
              onPackInput(
                'bottle',
                this.value
              )

          >

        </div>


        <div class="input-group">

          <label>
            Кол-во, шт
          </label>

          <input
            type="number"
            value="${bottles}"
            readonly
          >

        </div>

      </div>


      <div
        class="calc-result ${packCost.bottle<=0?'empty':''}"
        data-pack-result="bottle"
      >

        ${
          packCost.bottle<=0
          ?
          'Введите цену за штуку'
          :
          'Стоимость: '+formatMoney(packCost.bottle)
        }

      </div>

    </div>


    <div class="calc-card">

      <div class="calc-card-head">

        <div>

          <div class="calc-card-title">
            Крышка
          </div>

          <div class="calc-card-usage">
            Количество: ${bottles} шт
          </div>

        </div>

      </div>


      <div class="calc-inputs">

        <div class="input-group">

          <label>
            Цена за шт, ₽
          </label>

          <input
            type="number"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="0"
            value="${packStorage.cap.price}"
            oninput="
              onPackInput(
                'cap',
                this.value
              )
            "
          >

        </div>


        <div class="input-group">

          <label>
            Кол-во, шт
          </label>

          <input
            type="number"
            value="${bottles}"
            readonly
          >

        </div>

      </div>


      <div
        class="calc-result ${packCost.cap<=0?'empty':''}"
        data-pack-result="cap"
      >

        ${
          packCost.cap<=0
          ?
          'Введите цену за штуку'
          :
          'Стоимость: '+formatMoney(packCost.cap)
        }

      </div>

    </div>


    <div class="calc-card">

      <div class="calc-card-head">

        <div>

          <div class="calc-card-title">
            Этикетка
          </div>

          <div class="calc-card-usage">
            Количество: ${bottles} шт
          </div>

        </div>

      </div>


      <div class="calc-inputs">

        <div class="input-group">

          <label>
            Цена за шт, ₽
          </label>

          <input
            type="number"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="0"
            value="${packStorage.label.price}"
            oninput="
              onPackInput(
                'label',
                this.value
              )
            "
          >

        </div>


        <div class="input-group">

          <label>
            Кол-во, шт
          </label>

          <input
            type="number"
            value="${bottles}"
            readonly
          >

        </div>

      </div>


      <div
        class="calc-result ${packCost.label<=0?'empty':''}"
        data-pack-result="label"
      >

        ${
          packCost.label<=0
          ?
          'Введите цену за штуку'
          :
          'Стоимость: '+formatMoney(packCost.label)
        }

      </div>

    </div>

  `;


  /* ---------- HTML МОДАЛКИ ---------- */

  modalContent.innerHTML=`

    <div class="modal-header">

      <h2>
        ${d.emoji} ${d.name}
      </h2>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div class="volume-box">

      <label>
        Хочу получить
      </label>

      <div class="volume-controls">

        <button
          onclick="changeVolume(-1)"
        >
          −
        </button>


        <div class="volume-input-wrap">

          <input
            type="number"
            id="volumeInput"
            value="${v}"
            min="0.5"
            step="0.5"
            inputmode="decimal"
          >

          <span class="unit">
            л
          </span>

        </div>


        <button
          onclick="changeVolume(1)"
        >
          +
        </button>

      </div>

    </div>


    <div class="section-title">
      Ингредиенты
    </div>

    <div class="ingredients">
      ${ingHtml}
    </div>


    <div class="section-title">
      Подробное приготовление
    </div>

    <div class="steps">
      ${stepsHtml}
    </div>


    ${
      d.note
      ?
      `
        <div class="note">
          💡 ${d.note}
        </div>
      `
      :
      ''
    }


    <div class="section-title">
      Себестоимость ингредиентов
    </div>

    <div class="hint">

      Укажите цену упаковки и её объём.
      Программа автоматически рассчитает
      стоимость расхода ингредиента на выбранную партию.

    </div>

    <div>
      ${costHtml}
    </div>


    <div class="section-title">
      Упаковка
    </div>

    <div class="hint">

      Количество бутылок считается автоматически:
      ${formatNumber(v)} л ÷ 0,3 л =
      ${bottles} шт.

    </div>

    <div>
      ${packHtml}
    </div>


    <div
      class="totals"
      id="totalsBlock"
    ></div>

  `;


  /* ---------- ОБЪЁМ ---------- */

  const input=
    document.getElementById('volumeInput');


  input.addEventListener(
    'change',
    e=>{

      const val=
        toNumber(e.target.value);

      if(val<0.5){

        currentVolume=0.5;

        renderModal();

        return;
      }

      currentVolume=val;

      renderModal();

    }
  );


  input.addEventListener(
    'blur',
    e=>{

      const val=
        toNumber(e.target.value);

      if(val<0.5){

        currentVolume=0.5;

        renderModal();

      }

    }
  );


  updateTotals();
}


/* ==========================================================
   ИЗМЕНЕНИЕ ОБЪЁМА
========================================================== */

function changeVolume(delta){

  let v=
    currentVolume+delta;

  if(v<0.5)v=0.5;

  if(v>1000)v=1000;

  currentVolume=v;

  renderModal();
}


/* ==========================================================
   ЦЕНА ИНГРЕДИЕНТА
========================================================== */

function onPriceInput(
  drinkId,
  ingName,
  field,
  value
){

  setPriceField(
    drinkId,
    ingName,
    field,
    value
  );


  const d=
    drinks.find(
      x=>x.id===drinkId
    );


  const ing=
    d.ingredients.find(
      x=>x.name===ingName
    );


  const ratio=
    currentVolume/d.baseVolume;


  const cost=
    calcIngredientCost(
      drinkId,
      ing,
      ratio
    );


  const key=
    safeKey(ingName);


  const card=
    document.querySelector(
      `[data-cost-for="${drinkId}-${key}"]`
    );


  if(card){

    card.textContent=
      cost>0
      ?
      'Стоимость: '+formatMoney(cost)
      :
      'Введите цену и объём упаковки';

    card.classList.toggle(
      'empty',
      cost<=0
    );

  }


  updateTotals();
}


/* ==========================================================
   УПАКОВКА
========================================================== */

function onPackInput(
  field,
  value
){

  packStorage[field].price=value;

  savePack();


  const bottles=
    Math.floor(
      currentVolume/0.3
    );


  const cost=
    toNumber(value)*bottles;


  const el=
    document.querySelector(
      `[data-pack-result="${field}"]`
    );


  if(el){

    el.textContent=
      cost>0
      ?
      'Стоимость: '+formatMoney(cost)
      :
      'Введите цену за штуку';

    el.classList.toggle(
      'empty',
      cost<=0
    );

  }


  updateTotals();
}


/* ==========================================================
   ОБЩИЙ РАСЧЁТ
========================================================== */

function updateTotals(){

  const d=
    currentDrink;

  if(!d)return;


  const v=
    currentVolume;


  const ratio=
    v/d.baseVolume;


  const bottles=
    Math.floor(
      v/0.3
    );


  let ingCost=0;


  d.ingredients.forEach(
    ing=>{

      ingCost+=
        calcIngredientCost(
          d.id,
          ing,
          ratio
        );

    }
  );


  const packCost=
    calcPackCost(bottles);


  const totalCost=
    ingCost+
    packCost.total;


  const costPerBottle=
    bottles>0
    ?
    totalCost/bottles
    :
    0;


  const sellPrice=
    toNumber(
      packStorage.sellPrice
    );


  const revenue=
    sellPrice*bottles;


  const profit=
    revenue-totalCost;


  const profitPerBottle=
    bottles>0
    ?
    profit/bottles
    :
    0;


  const totalsEl=
    document.getElementById(
      'totalsBlock'
    );


  if(!totalsEl)return;


  const hasCost=
    totalCost>0;


  const hasSell=
    sellPrice>0;


  totalsEl.innerHTML=`

    <div class="total-row">

      <span class="label">
        Ингредиенты
      </span>

      <span class="value">
        ${formatMoney(ingCost)}
      </span>

    </div>


    <div class="total-row">

      <span class="label">
        Упаковка (${bottles} шт)
      </span>

      <span class="value">
        ${formatMoney(packCost.total)}
      </span>

    </div>


    <div class="total-row big">

      <span class="label">
        Себестоимость партии
      </span>

      <span class="value">
        ${formatMoney(totalCost)}
      </span>

    </div>


    <div class="total-row">

      <span class="label">
        Себестоимость 1 бутылки
      </span>

      <span class="value">
        ${formatMoney(costPerBottle)}
      </span>

    </div>


    <div class="sell-block">

      <div class="input-group">

        <label>
          Цена продажи 1 бутылки, ₽
        </label>

        <input
          type="number"
          inputmode="decimal"
          min="0"
          step="1"
          placeholder="0"
          value="${packStorage.sellPrice}"
          oninput="
            onSellPriceInput(
              this.value
            )
          "
        >

      </div>

    </div>


    ${
      !hasCost

      ?

      `
        <div class="profit-box empty">
          Введите цены ингредиентов
          и упаковки, чтобы увидеть прибыль
        </div>
      `

      :

      !hasSell

      ?

      `
        <div class="profit-box empty">
          Введите цену продажи,
          чтобы увидеть прибыль
        </div>
      `

      :

      profit>=0

      ?

      `
        <div class="profit-box">

          <span class="big-num">
            +${formatMoney(profit)}
          </span>

          <span class="sub">
            Прибыль с партии ·
            ${formatMoney(profitPerBottle)}
            с бутылки
          </span>

        </div>
      `

      :

      `
        <div class="profit-box negative">

          <span class="big-num">
            −${formatMoney(Math.abs(profit))}
          </span>

          <span class="sub">
            Убыток с партии ·
            ${formatMoney(Math.abs(profitPerBottle))}
            с бутылки
          </span>

        </div>
      `
    }

  `;
}


/* ==========================================================
   ЦЕНА ПРОДАЖИ
========================================================== */

function onSellPriceInput(value){

  packStorage.sellPrice=value;

  savePack();

  updateTotals();


  const input=
    document.querySelector(
      '.sell-block input'
    );


  if(input){

    const pos=
      input.value.length;

    input.focus();

    try{

      input.setSelectionRange(
        pos,
        pos
      );

    }catch(e){}

  }
}

    .replace(/\\/g,'\\\\')

renderHome();
