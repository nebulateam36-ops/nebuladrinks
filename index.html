<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html { font-size: 16px; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f13;
    color: #e8e8ec;
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-text-size-adjust: 100%;
  }

  header {
    background: linear-gradient(135deg, #1a1a24 0%, #0f0f13 100%);
    padding: 20px 16px;
    text-align: center;
    border-bottom: 1px solid #2a2a38;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(10px);
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    font-size: 11px;
    color: #6b6b7b;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .container {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .category-title {
    font-size: 13px;
    font-weight: 600;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 20px 0 10px 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .card {
    background: #1a1a24;
    border: 1px solid #2a2a38;
    border-radius: 14px;
    padding: 16px 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }

  .card:active {
    transform: scale(0.97);
    background: #22222e;
  }

  .card .emoji { font-size: 26px; }
  .card .name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .card .sub { font-size: 10px; color: #6b6b7b; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }

  .modal-overlay.active { display: block; }

  .modal {
    background: #1a1a24;
    border: 1px solid #2a2a38;
    border-radius: 18px;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    gap: 10px;
  }

  .modal-header h2 {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    flex: 1;
  }

  .close-btn {
    background: #2a2a38;
    border: none;
    color: #e8e8ec;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .volume-box {
    background: #0f0f13;
    border: 1px solid #2a2a38;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 18px;
  }

  .volume-box > label {
    display: block;
    font-size: 12px;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .volume-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .volume-controls button {
    background: #2a2a38;
    border: none;
    color: #e8e8ec;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .volume-controls button:active {
    background: #3a3a48;
    transform: scale(0.95);
  }

  .volume-controls input {
    flex: 1;
    background: #1a1a24;
    border: 2px solid #3a3a48;
    border-radius: 12px;
    padding: 0 12px;
    height: 48px;
    color: #e8e8ec;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    outline: none;
    min-width: 0;
  }

  .volume-controls input:focus { border-color: #a78bfa; }

  .volume-controls .unit {
    font-size: 14px;
    color: #6b6b7b;
    font-weight: 600;
    flex-shrink: 0;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 20px 0 10px 0;
  }

  .ingredients { display: flex; flex-direction: column; gap: 6px; }

  .ingredient {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f0f13;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    gap: 10px;
  }

  .ingredient .ing-name { color: #c0c0d0; flex: 1; }
  .ingredient .ing-value { font-weight: 700; color: #a78bfa; white-space: nowrap; }

  .steps { display: flex; flex-direction: column; gap: 10px; }

  .step {
    background: #0f0f13;
    border-radius: 10px;
    padding: 14px;
    display: flex;
    gap: 12px;
  }

  .step-num {
    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .step-text { font-size: 13px; line-height: 1.5; color: #c0c0d0; }

  .note {
    background: rgba(167, 139, 250, 0.1);
    border-left: 3px solid #a78bfa;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12px;
    line-height: 1.5;
    color: #b0b0c0;
    margin-top: 14px;
  }

  .cost-block {
    background: #0f0f13;
    border-radius: 12px;
    padding: 4px 14px;
  }

  .cost-row {
    padding: 14px 0;
    border-bottom: 1px solid #1f1f2a;
  }

  .cost-row:last-child { border-bottom: none; }

  .cost-row .cost-name {
    font-size: 14px;
    font-weight: 600;
    color: #e8e8ec;
    margin-bottom: 4px;
  }

  .cost-row .cost-usage {
    font-size: 12px;
    color: #6b6b7b;
    margin-bottom: 10px;
  }

  .cost-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .input-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-field label {
    font-size: 11px;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .input-field input {
    background: #1a1a24;
    border: 2px solid #3a3a48;
    border-radius: 10px;
    padding: 0 12px;
    height: 48px;
    color: #e8e8ec;
    font-size: 16px;
    font-weight: 600;
    outline: none;
    width: 100%;
    min-width: 0;
  }

  .input-field input:focus { border-color: #34d399; }

  .input-field input[readonly] {
    background: #14141c;
    color: #6b6b7b;
    border-color: #2a2a38;
  }

  .cost-result {
    font-size: 13px;
    color: #34d399;
    font-weight: 600;
    margin-top: 8px;
    padding: 8px 10px;
    background: rgba(52, 211, 153, 0.08);
    border-radius: 8px;
    text-align: center;
  }

  .pack-block {
    background: #0f0f13;
    border-radius: 12px;
    padding: 4px 14px;
  }

  .totals {
    background: linear-gradient(135deg, #1a1a24 0%, #0f0f13 100%);
    border: 1px solid #2a2a38;
    border-radius: 14px;
    padding: 16px;
    margin-top: 16px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
    gap: 10px;
  }

  .total-row .value { font-weight: 700; color: #e8e8ec; white-space: nowrap; }

    border-top: 1px solid #2a2a38;
    margin-top: 10px;
    padding-top: 14px;
    font-size: 16px;
  }

  .total-row.big .value { color: #34d399; font-size: 18px; }

  .profit-input {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #2a2a38;
  }

  .profit-input .input-field label {
    font-size: 12px;
    color: #a0a0b0;
    text-transform: none;
    letter-spacing: 0;
  }

  .profit-input .input-field input {
    border-color: #34d399;
  }

  .profit-result {
    margin-top: 12px;
    padding: 14px;
    background: rgba(52, 211, 153, 0.1);
    border-radius: 10px;
    font-size: 14px;
    color: #34d399;
    text-align: center;
    font-weight: 600;
    line-height: 1.6;
  }

  .profit-result.negative {
    background: rgba(248, 113, 113, 0.1);
    color: #f87171;
  }

  .hint {
    font-size: 12px;
    color: #6b6b7b;
    line-height: 1.5;
    margin-bottom: 10px;
    padding: 0 4px;
  }
</style>

const app = document.getElementById('app');
const overlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');

let currentDrink = null;
let currentVolume = 10;

const priceStorage = {};

const packStorage = {
  bottle: { price: '' },
  cap: { price: '' },
  label: { price: '' },
  sellPrice: ''
};

function loadStorage() {
  try {
    const saved = localStorage.getItem('nebula_prices');
    if (saved) Object.assign(priceStorage, JSON.parse(saved));

    const savedPack = localStorage.getItem('nebula_pack');
    if (savedPack) Object.assign(packStorage, JSON.parse(savedPack));

    const savedSell = localStorage.getItem('nebula_sell_price');
    if (savedSell) packStorage.sellPrice = savedSell;
  } catch (e) { console.warn('Ошибка загрузки', e); }
}

function savePrices() {
  try { localStorage.setItem('nebula_prices', JSON.stringify(priceStorage)); } catch (e) {}
}

function savePack() {
  try { localStorage.setItem('nebula_pack', JSON.stringify(packStorage)); } catch (e) {}
}

function getPrice(drinkId, ingName) {
  if (!priceStorage[drinkId]) priceStorage[drinkId] = {};
  if (!priceStorage[drinkId][ingName]) {
    priceStorage[drinkId][ingName] = { price: '', packSize: '' };
  }
  return priceStorage[drinkId][ingName];
}

function setPrice(drinkId, ingName, field, value) {
  if (!priceStorage[drinkId]) priceStorage[drinkId] = {};
  if (!priceStorage[drinkId][ingName]) {
    priceStorage[drinkId][ingName] = { price: '', packSize: '' };
  }
  priceStorage[drinkId][ingName][field] = value;
  savePrices();
}

function setPack(field, value) {
  packStorage[field] = value;
  savePack();
}

function renderHome() {
  const categories = {};
  drinks.forEach(d => {
    if (!categories[d.category]) categories[d.category] = [];
    categories[d.category].push(d);
  });

  let html = '';
  for (const cat in categories) {
    html += `<div class="category-title">${cat}</div>`;
    html += '<div class="grid">';
    categories[cat].forEach(d => {
      html += `
        <div class="card" onclick="openDrink('${d.id}')">
          <div class="emoji">${d.emoji}</div>
          <div class="name">${d.name}</div>
          <div class="sub">${d.baseVolume} л база</div>
        </div>
      `;
    });
    html += '</div>';
  }
  app.innerHTML = html;
}

function openDrink(id) {
  currentDrink = drinks.find(d => d.id === id);
  currentVolume = currentDrink.baseVolume;
  renderModal();
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});

function formatNumber(num) {
  if (num === 0) return '0';
  if (num >= 100) return Math.round(num).toString();
  if (num >= 10) return num.toFixed(1).replace(/\.0$/, '');
  if (num >= 1) return num.toFixed(2).replace(/\.?0+$/, '');
  return num.toFixed(3).replace(/\.?0+$/, '');
}

function formatMoney(num) {
  if (!isFinite(num) || num <= 0) return '—';
  return num.toFixed(2) + ' ₽';
}

function renderModal() {
  const d = currentDrink;
  const v = currentVolume;
  const ratio = v / d.baseVolume;

  let ingHtml = '';
  d.ingredients.forEach(ing => {
    let displayValue;
    if (ing.isTopUp) displayValue = `до ${formatNumber(v)} ${ing.unit}`;
    else if (ing.isCustom) displayValue = ing.value;
    else displayValue = `${formatNumber(ing.value * ratio)} ${ing.unit}`;
    ingHtml += `
      <div class="ingredient">
        <span class="ing-name">${ing.name}</span>
        <span class="ing-value">${displayValue}</span>
      </div>
    `;
  });

  let stepsHtml = '';
  d.steps.forEach((step, i) => {
    let text = step;
    d.ingredients.forEach(ing => {
      const key = getKeyForIngredient(ing.name);
      if (key && text.includes(`{${key}}`)) {
        let val;
        if (ing.isTopUp) val = `до ${formatNumber(v)} ${ing.unit}`;
        else if (ing.isCustom) val = ing.value;
        else val = `${formatNumber(ing.value * ratio)} ${ing.unit}`;
        text = text.replace(new RegExp(`\\{${key}\\}`, 'g'), val);
      }
    });
    text = text.replace(/\{total\}/g, `${formatNumber(v)} л`);
    stepsHtml += `
      <div class="step">
        <div class="step-num">${i + 1}</div>
        <div class="step-text">${text}</div>
      </div>
    `;
  });

  let costHtml = '';
  d.ingredients.forEach(ing => {
    if (ing.isTopUp || ing.isCustom) return;
    const usage = ing.value * ratio;
    const saved = getPrice(d.id, ing.name);
    const price = parseFloat(saved.price) || 0;
    const packSize = parseFloat(saved.packSize) || 0;
    let costForUsage = 0;
    if (price > 0 && packSize > 0) costForUsage = (price / packSize) * usage;

    costHtml += `
      <div class="cost-row">
        <div class="cost-name">${ing.name}</div>
        <div class="cost-usage">Расход: ${formatNumber(usage)} ${ing.unit}</div>
        <div class="cost-inputs">
          <div class="input-field">
            <label>Цена упак., ₽</label>
            <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
              value="${saved.price}"
              oninput="onPriceInput('${d.id}', '${ing.name.replace(/'/g, "\\'")}', 'price', this.value)">
          </div>
          <div class="input-field">
            <label>Объём упак., ${ing.unit}</label>
            <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
              value="${saved.packSize}"
              oninput="onPriceInput('${d.id}', '${ing.name.replace(/'/g, "\\'")}', 'packSize', this.value)">
          </div>
        </div>
        <div class="cost-result" id="cost-result-${d.id}-${ing.name.replace(/\s/g, '_')}">
          ${costForUsage > 0 ? `Стоимость: ${formatMoney(costForUsage)}` : 'Введите цену и объём упаковки'}
        </div>
      </div>
    `;
  });

  const bottles = Math.floor(v / 0.3);
  const packHtml = `
    <div class="cost-row">
      <div class="cost-name">Бутылка 300 мл</div>
      <div class="cost-usage">Количество: ${bottles} шт</div>
      <div class="cost-inputs">
        <div class="input-field">
          <label>Цена за шт, ₽</label>
          <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
            value="${packStorage.bottle.price}"
            oninput="onPackInput('bottle', this.value)">
        </div>
        <div class="input-field">
          <label>Кол-во, шт</label>
          <input type="number" inputmode="numeric" min="0" step="1"
            value="${bottles}" readonly>
        </div>
      </div>
      <div class="cost-result" id="pack-result-bottle">
        ${getPackResult('bottle', bottles)}
      </div>
    </div>

    <div class="cost-row">
      <div class="cost-name">Крышка</div>
      <div class="cost-usage">Количество: ${bottles} шт</div>
      <div class="cost-inputs">
        <div class="input-field">
          <label>Цена за шт, ₽</label>
          <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
            value="${packStorage.cap.price}"
            oninput="onPackInput('cap', this.value)">
        </div>
        <div class="input-field">
          <label>Кол-во, шт</label>
          <input type="number" inputmode="numeric" min="0" step="1"
            value="${bottles}" readonly>
        </div>
      </div>
      <div class="cost-result" id="pack-result-cap">
        ${getPackResult('cap', bottles)}
      </div>
    </div>

    <div class="cost-row">
      <div class="cost-name">Этикетка</div>
      <div class="cost-usage">Количество: ${bottles} шт</div>
      <div class="cost-inputs">
        <div class="input-field">
          <label>Цена за шт, ₽</label>
          <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
            value="${packStorage.label.price}"
            oninput="onPackInput('label', this.value)">
        </div>
        <div class="input-field">
          <label>Кол-во, шт</label>
          <input type="number" inputmode="numeric" min="0" step="1"
            value="${bottles}" readonly>
        </div>
      </div>
      <div class="cost-result" id="pack-result-label">
        ${getPackResult('label', bottles)}
      </div>
    </div>
  `;

  modalContent.innerHTML = `
    <div class="modal-header">
      <h2>${d.emoji} ${d.name}</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="volume-box">
      <label>Хочу получить</label>
      <div class="volume-controls">
        <button onclick="changeVolume(-1)">−</button>
        <input type="number" id="volumeInput" value="${v}" min="0.5" step="0.5" inputmode="decimal">
        <span class="unit">л</span>
        <button onclick="changeVolume(1)">+</button>
      </div>
    </div>

    <div class="section-title">Ингредиенты</div>
    <div class="ingredients">${ingHtml}</div>

    <div class="section-title">Приготовление</div>
    <div class="steps">${stepsHtml}</div>

    ${d.note ? `<div class="note">💡 ${d.note}</div>` : ''}

    <div class="section-title">Себестоимость ингредиентов</div>
    <div class="hint">Введите цену упаковки и её объём — программа посчитает стоимость расхода на партию.</div>
    <div class="cost-block">${costHtml}</div>

    <div class="section-title">Упаковка</div>
    <div class="hint">Количество бутылок, крышек и этикеток считается автоматически: ${formatNumber(v)} л ÷ 0,3 л = ${bottles} шт.</div>
    <div class="pack-block">${packHtml}</div>

    <div class="totals" id="totalsBlock"></div>
  `;

  const input = document.getElementById('volumeInput');
  input.addEventListener('input', (e) => {
    let val = parseFloat(e.target.value);
    if (isNaN(val) || val <= 0) return;
    currentVolume = val;
    renderModal();
    const newInput = document.getElementById('volumeInput');
    newInput.focus();
    newInput.setSelectionRange(newInput.value.length, newInput.value.length);
  });

  updateTotals();
}

function changeVolume(delta) {
  let v = currentVolume + delta;
  if (v < 0.5) v = 0.5;
  currentVolume = v;
  renderModal();
}

function onPriceInput(drinkId, ingName, field, value) {
  setPrice(drinkId, ingName, field, value);
  const d = drinks.find(x => x.id === drinkId);
  const ing = d.ingredients.find(x => x.name === ingName);
  const ratio = currentVolume / d.baseVolume;
  const usage = ing.value * ratio;
  const saved = getPrice(drinkId, ingName);
  const price = parseFloat(saved.price) || 0;
  const packSize = parseFloat(saved.packSize) || 0;
  let costForUsage = 0;
  if (price > 0 && packSize > 0) costForUsage = (price / packSize) * usage;

  const resultId = `cost-result-${drinkId}-${ingName.replace(/\s/g, '_')}`;
  const resultEl = document.getElementById(resultId);
  if (resultEl) {
    resultEl.textContent = costForUsage > 0
      ? `Стоимость: ${formatMoney(costForUsage)}`
      : 'Введите цену и объём упаковки';
  }
  updateTotals();
}

function onPackInput(field, value) {
  setPack(field, value);
  const v = currentVolume;
  const bottles = Math.floor(v / 0.3);

  const resultEl = document.getElementById(`pack-result-${field}`);
  if (resultEl) resultEl.textContent = getPackResult(field, bottles);

  updateTotals();
}

function getPackResult(field, bottles) {
  const price = parseFloat(packStorage[field].price) || 0;
  if (price <= 0) return 'Введите цену за штуку';
  const total = price * bottles;
  return `Стоимость: ${formatMoney(total)}`;
}

function updateTotals() {
  const d = currentDrink;
  const v = currentVolume;
  const ratio = v / d.baseVolume;
  const bottles = Math.floor(v / 0.3);

  let ingCost = 0;
  d.ingredients.forEach(ing => {
    if (ing.isTopUp || ing.isCustom) return;
    const usage = ing.value * ratio;
    const saved = getPrice(d.id, ing.name);
    const price = parseFloat(saved.price) || 0;
    const packSize = parseFloat(saved.packSize) || 0;
    if (price > 0 && packSize > 0) ingCost += (price / packSize) * usage;
  });

  const bottlePrice = parseFloat(packStorage.bottle.price) || 0;
  const capPrice = parseFloat(packStorage.cap.price) || 0;
  const labelPrice = parseFloat(packStorage.label.price) || 0;
  const packCost = (bottlePrice + capPrice + labelPrice) * bottles;

  const totalCost = ingCost + packCost;
  const costPerBottle = bottles > 0 ? totalCost / bottles : 0;

  const sellPrice = parseFloat(packStorage.sellPrice) || 0;
  const revenue = sellPrice * bottles;
  const profit = revenue - totalCost;
  const profitPerBottle = bottles > 0 ? profit / bottles : 0;

  const totalsEl = document.getElementById('totalsBlock');
  if (!totalsEl) return;

  totalsEl.innerHTML = `
    <div class="total-row">
      <span class="label">Ингредиенты</span>
      <span class="value">${formatMoney(ingCost)}</span>
    </div>
    <div class="total-row">
      <span class="label">Упаковка (${bottles} шт)</span>
      <span class="value">${formatMoney(packCost)}</span>
    </div>
    <div class="total-row big">
      <span class="label">Себестоимость партии</span>
      <span class="value">${formatMoney(totalCost)}</span>
    </div>
    <div class="total-row">
      <span class="label">Себестоимость 1 бутылки</span>
      <span class="value">${formatMoney(costPerBottle)}</span>
    </div>

    <div class="profit-input">
      <div class="input-field">
        <label>Цена продажи 1 бутылки, ₽</label>
        <input type="number" inputmode="decimal" min="0" step="1" placeholder="0"
          value="${packStorage.sellPrice || ''}"
          oninput="onSellPriceInput(this.value)">
      </div>
    </div>

    <div class="profit-result ${profit < 0 ? 'negative' : ''}">
      ${profit > 0
        ? `💰 Прибыль с партии: ${formatMoney(profit)}<br>Прибыль с бутылки: ${formatMoney(profitPerBottle)}`
        : profit < 0
          ? `⚠️ Убыток: ${formatMoney(Math.abs(profit))}`
          : 'Введите цену продажи, чтобы увидеть прибыль'}
    </div>
  `;
}

function onSellPriceInput(value) {
  packStorage.sellPrice = value;
  savePack();
  updateTotals();
  const input = document.querySelector('.profit-input input');
  if (input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

function getKeyForIngredient(name) {
  const map = {
    'Чёрный чай': 'tea',
    'Зелёный чай': 'tea',
    'Вода для заваривания': 'water',
    'Персиковый сироп': 'peach',
    'Клубничный сироп': 'strawberry',
    'Ягодный сироп': 'berry',
    'Пюре маракуйи': 'passion',
    'Апельсиновый сок': 'orange',
    'Манговое пюре': 'mango',
    'Лимонный сок': 'lemon',
    'Сахарный сироп': 'sugar',
    'Мятный настой/экстракт': 'mint',
    'Матча': 'matcha',
    'Вода 70–80 °C для диспергирования': 'dispWater',
    'Кофейная база': 'coffee',
    'Молоко': 'milk',
    'Ванильный сироп': 'vanilla',
    'Карамельный сироп': 'caramel',
    'Фисташковый сироп': 'pistachio',
    'Клубничное пюре/сироп': 'strawberry',
    'Кокосовый напиток': 'coconut',
    'Концентрат чёрной смородины': 'conc',
    'Концентрат маракуйи': 'conc',
    'Концентрат апельсина': 'conc',
    'Концентрат малины': 'conc',
    'Концентрат смородины': 'conc',
    'Концентрат клюквы': 'conc',
    'Концентрат лесных ягод': 'conc',
    'Концентрат облепихи': 'conc'
  };
  return map[name] || null;
}

loadStorage();
renderHome();
</script>

</body>
</html>
