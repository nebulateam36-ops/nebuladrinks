<style>
  * {

    padding: 0;

  body {

    padding: 20px 16px;
    text-align: center;
    border-bottom: 1px solid #2a2a38;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(10px);
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    font-size: 11px;
    color: #6b6b7b;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .container {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .category-title {
    font-size: 13px;
    font-weight: 600;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 20px 0 10px 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .card {
    background: #1a1a24;
    border: 1px solid #2a2a38;
    border-radius: 14px;
    padding: 16px 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }

  .card:active {
    transform: scale(0.97);
    background: #22222e;
  }

  .card .emoji {
    font-size: 26px;
  }

  .card .name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }

  .card .sub {
    font-size: 10px;
    color: #6b6b7b;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }

  .modal-overlay.active {
    display: block;
  }

  .modal {
    background: #1a1a24;
    border: 1px solid #2a2a38;
    border-radius: 18px;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .modal-header h2 {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    flex: 1;
  }

  .close-btn {
    background: #2a2a38;
    border: none;
    color: #e8e8ec;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: 10px;
  }

  .volume-input {
    background: #0f0f13;
    border: 1px solid #2a2a38;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .volume-input label {
    font-size: 13px;
    color: #a0a0b0;
    flex: 1;
  }

  .volume-input input {
    background: #1a1a24;
    border: 1px solid #3a3a48;
    border-radius: 8px;
    padding: 10px 12px;
    color: #e8e8ec;
    font-size: 16px;
    font-weight: 600;
    width: 90px;
    text-align: center;
    outline: none;
  }

  .volume-input input:focus {
    border-color: #a78bfa;
  }

  .volume-input .unit {
    font-size: 13px;
    color: #6b6b7b;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: #6b6b7b;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 18px 0 10px 0;
  }

  .ingredients {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ingredient {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f0f13;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
  }

  .ingredient .ing-name {
    color: #c0c0d0;
    flex: 1;
  }

  .ingredient .ing-value {
    font-weight: 700;
    color: #a78bfa;
    white-space: nowrap;
    margin-left: 10px;
  }

  .steps {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .step {
    background: #0f0f13;
    border-radius: 10px;
    padding: 14px;
    display: flex;
    gap: 12px;
  }

    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .step-text {
    font-size: 13px;
    line-height: 1.5;
    color: #c0c0d0;
  }

    background: rgba(167, 139, 250, 0.1);
    border-left: 3px solid #a78bfa;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12px;
    line-height: 1.5;
    color: #b0b0c0;
    margin-top: 14px;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #6b6b7b;
    font-size: 14px;
  }

// ============================================================
// ЛОГИКА
// ============================================================

const app = document.getElementById('app');
const overlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');

let currentDrink = null;
let currentVolume = 10;

// --- Рендер главного экрана ---
function renderHome() {
  const categories = {};
  drinks.forEach(d => {
    if (!categories[d.category]) categories[d.category] = [];
    categories[d.category].push(d);
  });

  let html = '';
  for (const cat in categories) {
    html += `<div class="category-title">${cat}</div>`;
    html += '<div class="grid">';
    categories[cat].forEach(d => {
      html += `
        <div class="card" onclick="openDrink('${d.id}')">
          <div class="emoji">${d.emoji}</div>
          <div class="name">${d.name}</div>
          <div class="sub">${d.baseVolume} л база</div>
        </div>
      `;
    });
    html += '</div>';
  }
  app.innerHTML = html;
}

// --- Открыть напиток ---
function openDrink(id) {
  currentDrink = drinks.find(d => d.id === id);
  currentVolume = currentDrink.baseVolume;
  renderModal();
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

// --- Закрыть ---
function closeModal() {
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});

// --- Пересчёт ингредиентов ---
function scaleValue(baseValue, baseVolume, targetVolume) {
  if (typeof baseValue === 'string') return baseValue;
  const scaled = (baseValue / baseVolume) * targetVolume;
  return formatNumber(scaled);
}

function formatNumber(num) {
  if (num >= 100) return Math.round(num).toString();
  if (num >= 10) return num.toFixed(1).replace(/\.0$/, '');
  if (num >= 1) return num.toFixed(2).replace(/\.?0+$/, '');
  return num.toFixed(3).replace(/\.?0+$/, '');
}

// --- Рендер модального окна ---
function renderModal() {
  const d = currentDrink;
  const v = currentVolume;
  const ratio = v / d.baseVolume;

  // Ингредиенты
  let ingHtml = '';
  d.ingredients.forEach(ing => {
    let displayValue;
    if (ing.isTopUp) {
      displayValue = `до ${formatNumber(v)} ${ing.unit}`;
    } else if (ing.isCustom) {
      displayValue = ing.value;
    } else {
      const scaled = ing.value * ratio;
      displayValue = `${formatNumber(scaled)} ${ing.unit}`;
    }
    ingHtml += `
      <div class="ingredient">
        <span class="ing-name">${ing.name}</span>
        <span class="ing-value">${displayValue}</span>
      </div>
    `;
  });

  // Шаги — подставляем числа
  let stepsHtml = '';
  d.steps.forEach((step, i) => {
    let text = step;
    // Подстановка значений
    d.ingredients.forEach(ing => {
      const key = getKeyForIngredient(ing.name);
      if (key && text.includes(`{${key}}`)) {
        let val;
        if (ing.isTopUp) {
          val = `до ${formatNumber(v)} ${ing.unit}`;
        } else if (ing.isCustom) {
          val = ing.value;
        } else {
          val = `${formatNumber(ing.value * ratio)} ${ing.unit}`;
        }
        text = text.replace(new RegExp(`\\{${key}\\}`, 'g'), val);
      }
    });
    // {total}
    text = text.replace(/\{total\}/g, `${formatNumber(v)} л`);
    stepsHtml += `
      <div class="step">
        <div class="step-num">${i + 1}</div>
        <div class="step-text">${text}</div>
      </div>
    `;
  });

  modalContent.innerHTML = `
    <div class="modal-header">
      <h2>${d.emoji} ${d.name}</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="volume-input">
      <label>Хочу получить:</label>
      <input type="number" id="volumeInput" value="${v}" min="0.5" step="0.5" inputmode="decimal">
      <span class="unit">л</span>
    </div>

    <div class="section-title">Ингредиенты</div>
    <div class="ingredients">${ingHtml}</div>

    <div class="section-title">Приготовление</div>
    <div class="steps">${stepsHtml}</div>

    ${d.note ? `<div class="note">💡 ${d.note}</div>` : ''}
  `;

  // Обработчик изменения объёма
  const input = document.getElementById('volumeInput');
  input.addEventListener('input', (e) => {
    let val = parseFloat(e.target.value);
    if (isNaN(val) || val <= 0) return;
    currentVolume = val;
    renderModal();
    // Восстановить фокус
    const newInput = document.getElementById('volumeInput');
    newInput.focus();
    newInput.setSelectionRange(newInput.value.length, newInput.value.length);
  });
}

// --- Ключи для подстановки в шаги ---
function getKeyForIngredient(name) {
  const map = {
    'Чёрный чай': 'tea',
    'Зелёный чай': 'tea',
    'Вода для заваривания': 'water',
    'Персиковый сироп': 'peach',
    'Клубничный сироп': 'strawberry',
    'Ягодный сироп': 'berry',
    'Пюре маракуйи': 'passion',
    'Апельсиновый сок': 'orange',
    'Манговое пюре': 'mango',
    'Лимонный сок': 'lemon',
    'Сахарный сироп': 'sugar',
    'Мятный настой/экстракт': 'mint',
    'Матча': 'matcha',
    'Вода 70–80 °C для диспергирования': 'dispWater',
    'Кофейная база': 'coffee',
    'Молоко': 'milk',
    'Ванильный сироп': 'vanilla',
    'Карамельный сироп': 'caramel',
    'Фисташковый сироп': 'pistachio',
    'Клубничное пюре/сироп': 'strawberry',
    'Кокосовый напиток': 'coconut'
  };
  return map[name] || null;
}
